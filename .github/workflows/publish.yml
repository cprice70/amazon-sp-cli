name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual trigger for re-publishing a version whose tag already exists,
  # e.g. after a failed run. Publishes whatever version package.json holds.
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing: the job exchanges a GitHub OIDC
  # token for a short-lived npm credential, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm publish --access public
